name: CI

on:
  push:
    branches: [main, features, deployment]
  pull_request:
    branches: [main, features, deployment]


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      

      - name: Set up uv 
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Verify environment
        run: |
          uv --version
          python --version
          uv run ruff --version
          uv run pytest --version

      - name: Lint with ruff
        run: |
          uv run ruff check app tests evals
          uv run ruff format --check app tests evals

      - name: Test with pytest
        env:
          LOGFIRE_IGNORE_NO_CONFIG: 1
          JINA_API_KEY: dummy
          GROQ_API_KEY: dummy
          PORTKEY_API_KEY: dummy
          PORTKEY_PRIMARY_CONFIG_ID: pc-dummy
          QDRANT_URL: https://dummy.example.com
          NEON_DB_URL: postgres://dummy:dummy@dummy.db:5432/dummy
          UPSTASH_REDIS_REST_URL: https://dummy.example.com
          UPSTASH_REDIS_REST_TOKEN: dummy
        run: |
          uv run pytest tests/
