[project]
name = "enterprise-grade-rag-applications"
version = "0.1.0"
description = "A modular, production-ready framework for building enterprise-grade RAG and agentic AI applications with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.139.2",
    "flashrank>=0.2.10",
    "langchain==1.2.18",
    "langchain-community==0.4.1",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.5",
    "langgraph==1.1.10",
    "logfire>=4.37.0",
    "nemoguardrails>=0.23.0",
    "pdfplumber>=0.11.10",
    "portkey-ai>=2.3.2",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.2",
    "unstructured>=0.24.1",
    "uvicorn[standard]>=0.51.0",
]

[tool.ruff.lint.per-file-ignores]
"evals/app.py" = ["E402"]
"app/main.py" = ["E402"]
