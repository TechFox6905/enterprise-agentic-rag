[project]
name = "enterprise-grade-rag-applications"
version = "0.1.0"
description = "A modular, production-ready framework for building enterprise-grade RAG and agentic AI applications with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11.12"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.139.2",
    "flashrank>=0.2.10",
    "langchain==1.2.18",
    "langchain-community==0.4.1",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.5",
    "langgraph==1.1.10",
    "langgraph-checkpoint-postgres>=3.1.0",
    "limits>=5.8.0",
    "logfire>=4.37.0",
    "nemoguardrails>=0.23.0",
    "pdfplumber>=0.11.10",
    "portkey-ai==2.3.0",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "slowapi>=0.1.10",
    "streamlit>=1.59.2",
    "unstructured>=0.24.1",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "ragas",
    "deepeval",
    "nest-asyncio",
    "locust",
]

[tool.ruff.lint.per-file-ignores]
"evals/app.py" = ["E402"]
"app/main.py" = ["E402"]
"app/ingestion/processor.py" = ["E402"]
# __init__.py files re-export public symbols.
"app/**/__init__.py" = ["F401"]
"evals/__init__.py" = ["F401"]